name: build

on:
  # Release builds only: pushing a v* tag runs build, test and release.
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  EXTRA_CFLAGS: ""

jobs:
  build:
    name: build (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            flags: ""
          - os: ubuntu-latest
            cc: clang
            flags: ""
          - os: macos-latest
            cc: clang
            flags: ""
          # Stub leg: no libcurl, no FFmpeg. Keeps the SDL2-only path building;
          # radio and AAC compile out and the Radio button is hidden.
          - os: ubuntu-latest
            cc: gcc
            flags: "NET=0 AAC=0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev pkg-config libcurl4-openssl-dev libavcodec-dev libavutil-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew uninstall --ignore-dependencies sdl2 2>/dev/null || true
          brew install sdl2 pkg-config curl ffmpeg
          # curl is keg-only on Homebrew, so pkg-config needs its path.
          echo "PKG_CONFIG_PATH=$(brew --prefix curl)/lib/pkgconfig:${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          make clean
          make CC=${{ matrix.cc }} WERROR=1 ${{ matrix.flags }}

      - name: Check --version
        run: ./aldrem --version | grep -Eq '^aldrem .+'

      - name: Build .app bundle (macOS)
        if: runner.os == 'macOS' && matrix.flags == ''
        run: |
          make app
          test -f build/aldrem.app/Contents/Info.plist
          plutil -lint build/aldrem.app/Contents/Info.plist

      - name: Package Linux binary
        if: runner.os == 'Linux' && matrix.cc == 'gcc' && matrix.flags == ''
        run: |
          mkdir -p dist
          cp aldrem dist/aldrem-linux-x86_64

      - name: Package macOS bundle
        if: runner.os == 'macOS' && matrix.flags == ''
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/aldrem.app dist/aldrem.app.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: matrix.flags == '' && (runner.os == 'macOS' || (runner.os == 'Linux' && matrix.cc == 'gcc'))
        with:
          name: dist-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  test:
    name: test (ubuntu-latest)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev pkg-config libcurl4-openssl-dev libavcodec-dev libavutil-dev

      - name: Generate WAV fixture
        run: |
          mkdir -p build
          python3 - <<'PY'
          import math, struct, wave

          rate, secs, freq = 44100, 1, 440.0
          frames = b''.join(
              struct.pack('<h', int(12000 * math.sin(2 * math.pi * freq * i / rate)))
              for i in range(rate * secs)
          )
          with wave.open('build/fixture.wav', 'wb') as w:
              w.setnchannels(1)
              w.setsampwidth(2)
              w.setframerate(rate)
              w.writeframes(frames)
          PY

      - name: Build and test
        run: make CC=gcc WERROR=1 test FIXTURE=build/fixture.wav

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: List assets
        run: ls -l dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/aldrem-linux-x86_64
            dist/aldrem.app.zip
          body_path: docs/release-notes-${{ github.ref_name }}.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: true
