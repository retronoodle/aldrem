name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d
        with:
          languages: c-cpp
          build-mode: manual

      - name: Build
        run: make

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d
