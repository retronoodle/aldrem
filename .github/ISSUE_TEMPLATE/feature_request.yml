name: Feature request
description: Suggest an improvement or a new capability.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Aldrem stays small on purpose. Features that add a dependency, a build system, or a lot of code are a hard sell — tell me the problem first, then the idea.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The use case or annoyance, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to see. Mention if it needs a new dependency or vendored decoder.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This fits the "small, pure C99, no new heavy dependencies" goal.
        - label: I can open a PR for this.
