name: Bug report
description: Something doesn't work — a crash, a silent track, wrong UI.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please don't use this for security issues — see [SECURITY.md](https://github.com/retronoodle/mediaplayer/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Build with `make`
        2. Open file.flac
        3. Press ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse --short HEAD`, or the release you're using.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux (X11)
        - Linux (Wayland)
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Other
    validations:
      required: true
  - type: input
    id: format
    attributes:
      label: Audio format
      description: Extension and how it was produced, if relevant (e.g. `.ogg` Vorbis, chained).
  - type: textarea
    id: output
    attributes:
      label: Terminal output
      description: Anything printed when you ran the binary. Paste it in a code block.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I built from `main` and the build was warning-free.
        - label: I searched existing issues for this problem.
